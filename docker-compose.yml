# Base commune. En local : docker compose up --build, puis
#   docker compose port takienta-site 8080   (ou publier un port avec -p dans `docker run`)
services:
  takienta-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-takienta}-site
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
