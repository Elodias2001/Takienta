# En-têtes de sécurité, dans un fichier à part et `include`és dans CHAQUE bloc.
#
# Piège nginx : un `add_header` dans un bloc enfant annule TOUS ceux hérités du
# parent. Les répéter à la main marche, jusqu'au jour où l'on ajoute un
# `location` en oubliant la moitié de la liste. Un `include` rend l'oubli
# visible : soit la ligne est là, soit le bloc n'a aucun en-tête.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# Site statique sans script ni ressource tierce : la politique peut être stricte.
# Les polices sont hébergées (font-src 'self'), aucun service de polices externe.
add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
