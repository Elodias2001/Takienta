[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "benin-geo"
version = "0.1.0"
description = "La structure administrative du Bénin, avec la source de chaque enregistrement. Hors ligne, sans dépendance."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elodias ADIMOU", email = "olouwagnon@gmail.com" }]
keywords = ["benin", "bénin", "communes", "departements", "arrondissements", "administratif", "geographie", "offline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://takienta.sabar.app"
Documentation = "https://takienta.sabar.app/docs/"
Repository = "https://github.com/Elodias2001/Takienta"
Issues = "https://github.com/Elodias2001/Takienta/issues"

[tool.hatch.build]
# _generated.py est ignoré par Git (généré par scripts/build-data.mjs) mais doit être livré.
artifacts = ["src/benin_geo/_generated.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/benin_geo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
